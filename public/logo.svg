<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 500" width="100%" height="100%">
  <defs>
    <!-- Primary Blue Gradient -->
    <linearGradient id="kzBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="60%" stop-color="#0052D4" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>

    <!-- Top Roof Cap Gradient -->
    <linearGradient id="kzRoofGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>

    <!-- Vibrant Orange Gradient -->
    <linearGradient id="kzOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="50%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
  </defs>

  <!-- LOGO MARK ICON (Geometric K Roof) -->
  <g transform="translate(140, 20)">
    <!-- Blue Roof Slope (Right) -->
    <path d="M 130 25 L 205 65 C 215 70 215 82 205 87 L 165 108 C 158 112 148 112 141 107 L 115 90 L 115 25 Z" fill="url(#kzRoofGrad)" />
    
    <!-- Left Main Pillar + Blue Roof Slope -->
    <path d="M 115 25 L 115 220 C 115 228 108 235 100 237 L 75 241 C 65 243 55 236 55 225 L 55 75 C 55 65 64 56 75 53 Z" fill="url(#kzBlueGrad)" />
    
    <!-- Inner Ridge Shadow -->
    <path d="M 115 25 L 141 107 C 128 114 115 114 115 90 Z" fill="#040D21" opacity="0.35" />

    <!-- Orange Upper Branch -->
    <path d="M 100 135 L 175 82 C 183 77 194 79 200 87 L 240 135 C 246 142 244 153 236 159 L 155 215 C 148 220 138 218 132 211 L 100 170 Z" fill="url(#kzOrangeGrad)" />

    <!-- Orange Lower Extended Leg -->
    <path d="M 125 165 L 235 255 C 242 261 247 270 247 280 L 247 285 L 180 285 C 168 285 156 280 148 270 L 100 220 Z" fill="url(#kzOrangeGrad)" />
  </g>

  <!-- TYPOGRAPHY: "kazify" -->
  <g transform="translate(35, 330)">
    <!-- Letter k stem -->
    <path d="M 30 20 L 60 20 L 60 110 L 30 110 Z" fill="#0B132B" />
    <!-- Letter k top orange accent diagonal -->
    <path d="M 55 55 L 90 20 L 110 35 L 75 70 Z" fill="url(#kzOrangeGrad)" />
    <!-- Letter k lower navy leg -->
    <path d="M 60 65 L 110 110 L 80 110 L 45 78 Z" fill="#0B132B" />

    <!-- Letter a -->
    <text x="125" y="100" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="800" font-size="105" fill="#0B132B">a</text>
    <!-- Letter z -->
    <text x="190" y="100" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="800" font-size="105" fill="#0B132B">z</text>
    <!-- Letter i -->
    <text x="250" y="100" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="800" font-size="105" fill="#0B132B">i</text>
    <!-- Letter f -->
    <text x="285" y="100" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="800" font-size="105" fill="#0B132B">f</text>
    <!-- Letter y -->
    <text x="330" y="100" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="800" font-size="105" fill="#0B132B">y</text>
  </g>

  <!-- TAGLINE: "CONNECT • EMPOWER • GROW" -->
  <g transform="translate(30, 460)">
    <line x1="10" y1="-7" x2="65" y2="-7" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
    <text x="80" y="0" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="18" letter-spacing="5" fill="#334155">
      CONNECT <tspan fill="#FF7A00">•</tspan> EMPOWER <tspan fill="#FF7A00">•</tspan> GROW
    </text>
    <line x1="435" y1="-7" x2="490" y2="-7" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
